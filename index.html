<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="600">
  <title>War Room - Dashboard</title>

  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --text: #22324a;
      --muted: #7c8899;
      --border: #e4e7ec;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.10);
      --radius: 16px;
      --accent: #f6a313;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #d8dee6 0%, #eef2f6 100%);
      color: var(--text);
    }

    body {
      padding: 14px;
    }

    .app {
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 24px;
      background: #f1f4f8;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #133c66, #1f548d 70%, #f6a313 140%);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 400;
      color: #335b8c;
    }

    .brand-text p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      background: var(--accent);
      color: #5d3b00;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .card {
      flex: 1;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 16px;
      border-bottom: 1px solid #eef1f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #31465f;
    }

    .card-index {
      font-size: 12px;
      color: var(--muted);
      background: #f5f7fa;
      border: 1px solid #e7ebf0;
      padding: 5px 9px;
      border-radius: 999px;
    }

    .image-frame {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background: #fbfcfe;
      padding: 0;
      overflow: hidden;
      position: relative;
    }

.image-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top; /* garde le haut visible */
  position: relative;
  top: -90px;
}

    .hint {
      padding: 12px 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      flex: 0 0 auto;
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand-text h1 {
        font-size: 22px;
      }
    }
	.logo-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none; /* évite de gêner les clics */
}

.logo-center img {
  height: 60px; /* ajuste si besoin */
  object-fit: contain;
}
  </style>
</head>

<body>
  <div class="app">
 <header class="topbar">
  <div class="brand">
    <div class="logo-box">
      <img
        src="lo.png"
        alt="Logo"
        onerror="this.style.display='none'; this.parentNode.textContent='WR';"
      >
    </div>
    <div class="brand-text">
      <h1>Scorecard WarRoom by BL</h1>
      <p></p>
    </div>
  </div>

  <!-- Logo centré -->
  <div class="logo-center">
    <img src="logo.png" alt="Mission SAV">
  </div>

  <div class="badge">War Room</div>
</header>

    <main class="card">
      <div class="card-header">
        <h2 class="card-title">Vue globale</h2>
        <span class="card-index">WAR ROOM ASSISTANCE V2.png</span>
      </div>

      <div class="image-frame">
        <img src="WAR ROOM ASSISTANCE V2.png" alt="Dashboard Salesforce">
      </div>

      <div class="hint">
        Export Salesforce mis à jour régulièrement
      </div>
    </main>
  </div>
</body>
</html
